schema_version: 2
seed: 2026
dataset_root: D:/Study/AICChallenge

sample_policy:
  positives_total: 100
  negatives_total: 100
  candidate_multiplier: 4
  domains:
    L21:
      keyframe_root: Keyframes_L21/keyframes
      dev_videos: [L21_V001, L21_V003, L21_V006, L21_V009, L21_V012]
      holdout_videos: [L21_V015, L21_V018, L21_V021, L21_V025, L21_V030]
    L29:
      keyframe_root: Keyframes_L29/keyframes
      dev_videos: [L29_V001, L29_V008, L29_V014]
      holdout_videos: [L29_V004, L29_V012]

recognizers:
  - id: vietocr_vgg_transformer
    family: vietocr_recognizer
    enabled: true
    params:
      vietocr_config: vgg_transformer
      device: cuda
  - id: easyocr_vi_en_recognizer
    family: easyocr_recognizer
    enabled: true
    params:
      languages: [vi, en]
      gpu: true
  - id: paddleocr_v5_latin_recognizer
    family: paddle_recognizer
    enabled: true
    params:
      model_name: latin_PP-OCRv5_mobile_rec
      device: gpu

fixed_detector:
  family: easyocr
  languages: [vi, en]
  gpu: true

crop_padding_ratio: 0.05
confidence_thresholds: [0.00, 0.05, 0.10, 0.15, 0.20, 0.25, 0.30, 0.35, 0.40, 0.45, 0.50, 0.55, 0.60, 0.65, 0.70, 0.75, 0.80, 0.85, 0.90, 0.95]
gate:
  max_false_positive_rate: 0.05
  min_positive_recall: 0.80
bootstrap_iterations: 10000
retrieval:
  queries_total: 40
  bm25_k1: 1.5
  bm25_b: 0.75
  rrf_k: 60
  ranks: [1, 5, 20, 50, 100]
